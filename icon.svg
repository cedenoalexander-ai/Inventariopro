<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Main Content Group (Central 75% Safe Zone for Maskable Compatibility) -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- 3D Box Illustration -->
    <!-- Top Face -->
    <path d="M 0 -105 L 115 -42 L 0 20 L -115 -42 Z" fill="url(#boxTop)" />
    <!-- Left Face -->
    <path d="M -115 -42 L 0 20 L 0 145 L -115 82 Z" fill="url(#boxSide)" />
    <!-- Right Face -->
    <path d="M 0 20 L 115 -42 L 115 82 L 0 145 Z" fill="url(#boxFront)" />

    <!-- Box Tape / Seam -->
    <path d="M -25 -28 L 0 -14 L 25 -28 L 0 -42 Z" fill="#93c5fd" opacity="0.6"/>
    
    <!-- Barcode Badge on Front Right Face -->
    <g transform="translate(42, 48) skewY(-28) scale(0.75)">
      <rect x="-30" y="-18" width="60" height="36" rx="4" fill="#ffffff" opacity="0.95"/>
      <line x1="-22" y1="-10" x2="-22" y2="10" stroke="#0f172a" stroke-width="3"/>
      <line x1="-14" y1="-10" x2="-14" y2="10" stroke="#0f172a" stroke-width="2"/>
      <line x1="-8" y1="-10" x2="-8" y2="10" stroke="#0f172a" stroke-width="4"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#0f172a" stroke-width="2"/>
      <line x1="8" y1="-10" x2="8" y2="10" stroke="#0f172a" stroke-width="3"/>
      <line x1="16" y1="-10" x2="16" y2="10" stroke="#0f172a" stroke-width="4"/>
      <line x1="22" y1="-10" x2="22" y2="10" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Success / In-Stock Emerald Badge Floating Top Right -->
    <g transform="translate(85, -65)">
      <circle cx="0" cy="0" r="38" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="4"/>
      <!-- Checkmark -->
      <path d="M -14 -1 L -4 9 L 14 -9" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Up/Down Inflow-Outflow dynamic arrows badge floating top left -->
    <g transform="translate(-85, -65)">
      <circle cx="0" cy="0" r="32" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
      <!-- Arrow Up (Inflow) -->
      <path d="M -8 8 L -8 -4 M -13 1 L -8 -4 L -3 1" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Arrow Down (Outflow) -->
      <path d="M 8 -8 L 8 4 M 3 -1 L 8 4 L 13 -1" fill="none" stroke="#f87171" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
